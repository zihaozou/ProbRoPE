[package]
name = "fs-app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel.workspace = true
eframe = "0.36"
egui = "0.36"
fs-calib = { path = "../fs-calib" }
fs-core = { path = "../fs-core" }
fs-recon = { path = "../fs-recon" }
fs-record = { path = "../fs-record" }
metavision-sys = { version = "0.1.0", path = "../metavision-sys" }
opencv = { version = "0.100.1", default-features = false, features = ["videoio", "imgproc", "calib3d", "imgcodecs", "clang-runtime"] }
serde.workspace = true
serde_json.workspace = true
spinnaker-sys = { version = "0.1.0", path = "../spinnaker-sys" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
